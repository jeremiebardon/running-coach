# `docker compose up --build` → Phoenix UI on :6006, coach API on :3000
#
#   curl localhost:3000/health
#   curl -X POST localhost:3000/chat -H 'content-type: application/json' \
#        -d '{"message":"Could I run a sub 2:55 marathon?"}'
#   # reuse the returned sessionId to continue the conversation
#
# Pin image versions instead of :latest once you go beyond the POC.
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # UI + OTLP/HTTP (/v1/traces)
      - "4317:4317" # OTLP/gRPC
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped

  coach:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env # API keys etc. — optional so the demo boots without it
        required: false
    environment:
      # inside the compose network, Phoenix is reachable by its service name
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      PHOENIX_HOST: http://phoenix:6006
      PHOENIX_PROJECT: ${PHOENIX_PROJECT:-running-coach}
      # fixtures by default; set DATA_SOURCE=intervals in .env for your real data
      DATA_SOURCE: ${DATA_SOURCE:-fixtures}
    extra_hosts:
      # lets the container reach a model server on your machine (Ollama/LM Studio)
      # via http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    depends_on:
      - phoenix
    restart: unless-stopped

volumes:
  phoenix_data:
