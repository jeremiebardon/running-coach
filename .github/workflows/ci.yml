# Fast feedback on every push/PR: no LLM calls, no secrets, ~1 min.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # domain math, adapter (mocked HTTP), agent loop (mock model), evaluators, HTTP server
      - run: npm test

  docker:
    # Catches a broken Dockerfile/lockfile before it reaches anyone's `docker compose up`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t running-coach:ci .
      - name: Smoke test (fixtures, no API key needed for /health)
        run: |
          docker run -d --name coach -p 3000:3000 -e DATA_SOURCE=fixtures running-coach:ci
          timeout 30 bash -c 'until curl -sf localhost:3000/health; do sleep 1; done'
          docker stop coach
